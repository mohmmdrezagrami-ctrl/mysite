<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E14;--card:#121A26;--line:#1E2A38;--cyan:#00D4FF;--violet:#7B2FF7;--main:#C8D3E0;--dim:#7d8ca0;--bright:#F3F7FB;--red:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--main);font-family:'Tajawal',sans-serif;min-height:100vh}
[hidden]{display:none!important}
input,textarea,button{font:inherit}
input[type=text],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--bright)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{background:linear-gradient(120deg,var(--cyan),#0ea5e0);color:#04141C;border:0;border-radius:8px;padding:10px 22px;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--main);border:1px solid var(--line)}
.btn.r{background:transparent;color:var(--red);border:1px solid var(--red)}
#login{max-width:340px;margin:22vh auto;padding:0 20px;text-align:center}
#login h1{color:var(--bright);margin-bottom:20px;font-size:1.4rem}
#login input{margin-bottom:12px;text-align:center}
#err{color:var(--red);font-size:.9rem;margin-top:10px;min-height:1.2em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,20,.95);z-index:5}
header b{color:var(--bright)}
.tabs{display:flex;gap:6px;padding:14px 22px 0;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs button.on{color:#04141C;background:var(--cyan);border-color:var(--cyan);font-weight:700}
main{padding:22px;max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{color:var(--bright);margin-bottom:12px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.num{font-size:2rem;font-weight:700;color:var(--cyan)}
.num+span{display:block;color:var(--dim);font-size:.88rem;margin-top:4px}
label.sw{display:flex;align-items:center;gap:10px;margin:12px 0 8px;color:var(--bright);cursor:pointer}
label.sw input{width:18px;height:18px;accent-color:var(--cyan)}
.hint{color:var(--dim);font-size:.85rem;margin-top:6px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1.6fr 1fr auto;gap:8px;margin-bottom:8px}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border:0}
.item small{color:var(--dim)}
.item p{margin-top:4px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bot{color:#a678ff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#04141C;padding:10px 22px;border-radius:8px;font-weight:700}
/* ===== Live chat ===== */
.sess{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sess:last-child{border:0}
.sess:hover{background:#0f1826}
.sess b{color:var(--bright);display:block}
.sess small{color:var(--dim)}
.badge{font-size:.72rem;padding:3px 9px;border-radius:20px;background:rgba(0,212,255,.12);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.badge.end{background:rgba(125,140,160,.12);color:var(--dim);border-color:var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}
.dot.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.dot.off{background:#5c6b7e}
#liveMsgs{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin-bottom:12px}
.lm{max-width:80%;padding:9px 13px;border-radius:10px;font-size:.9rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.lm.v{background:#1a2535;align-self:flex-start}
.lm.o,.lm.a{background:linear-gradient(120deg,var(--cyan),#0ea5e0);color:#04141C;align-self:flex-end;font-weight:500}
.lm small{display:block;font-size:.68rem;opacity:.7;margin-top:3px}
.replyRow{display:flex;gap:8px}
.replyRow textarea{min-height:44px}
.sess.unread{background:rgba(255,93,108,.06)}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;margin-left:6px;box-shadow:0 0 6px var(--red)}
.tabs button .rdot{margin-right:5px;margin-left:0}
.canned{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.canned button{background:#0f1826;border:1px solid var(--line);color:var(--main);padding:6px 12px;border-radius:20px;font-size:.8rem;cursor:pointer}
.canned button:hover{border-color:var(--cyan)}
.pinbtn{background:none;border:0;cursor:pointer;font-size:1.1rem;line-height:1}
</style>
</head>
<body>

<div id="login">
  <h1>🔒 دخول</h1>
  <input type="password" id="code" placeholder="الرمز" autocomplete="current-password">
  <button class="btn" id="go">دخول</button>
  <div id="err"></div>
</div>

<div id="app" hidden>
  <header><b>لوحة التحكم</b><span><button class="btn g" id="view">الموقع</button> <button class="btn g" id="out">خروج</button></span></header>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>

<script>
// ضع رابط الـ Worker هنا (نفس الرابط الموجود في index.html)
const API='https://tiny-mountain-7c6c.hussanjabba15.workers.dev';

const DEFP=[
 {name:'نظام إدارة داخلي',desc:'منصة لتنظيم العمليات الداخلية وتسهيل تتبّع المهام والبيانات بشكل مركزي.',stack:'Backend, DB'},
 {name:'تطبيق ويب تفاعلي',desc:'واجهة مستخدم سريعة الاستجابة مربوطة بخدمات API لمعالجة البيانات في الوقت الحقيقي.',stack:'Frontend, API'},
 {name:'أداة أتمتة مهام',desc:'سكربت يقلّل العمل اليدوي المتكرر ويحوّل عملية كانت تستهلك ساعات إلى دقائق.',stack:'Automation, Python'},
 {name:'موقع تعريفي مخصّص',desc:'تصميم وبناء صفحات تعريفية بهوية بصرية مستقلة، مبنية بالكامل بدون قوالب جاهزة.',stack:'HTML/CSS, UX'}];

// كل تبويب = عنصر هنا. لإضافة ميزة جديدة أضف تبويباً ودالة عرض.
const TABS={overview:['نظرة عامة',vOverview],site:['الموقع',vSite],ai:['الذكاء',vAI],projects:['المشاريع',vProjects],inbox:['الرسائل',vInbox],live:['الدردشة المباشرة',vLive]};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('ar-IQ');
let code=sessionStorage.getItem('c')||'',D,P,L={online:false,sessions:[]},openSid=null,S=null,tab='overview',liveTimer=null,liveSearch='';

async function api(p,body){
  const r=await fetch(API+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:code},body:body?JSON.stringify(body):undefined});
  if(r.status===401||r.status===429)throw r.status;
  return r.json();
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,1800)}

async function load(){
  if(!API){$('#err').textContent='ضع رابط الـ Worker في المتغير API أعلى الملف';return}
  try{
    [D,L]=await Promise.all([api('/api/admin/data'),api('/api/admin/live')]);
    localStorage.setItem('hj_admin','1');P=D.cfg.projects||DEFP.map(x=>({...x}));
    $('#login').hidden=true;$('#app').hidden=false;draw();
  }catch(e){$('#login').hidden=false;$('#app').hidden=true;sessionStorage.removeItem('c');$('#err').textContent=e===429?'محاولات كثيرة، انتظر 15 دقيقة':(code?'الرمز غلط':'')}
}
$('#go').onclick=()=>{code=$('#code').value;sessionStorage.setItem('c',code);load()};
$('#code').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#out').onclick=()=>{sessionStorage.removeItem('c');localStorage.removeItem('hj_admin');location.reload()};
$('#view').onclick=()=>open('index.html','_blank');

function draw(){
  const anyUnread=L.sessions.some(s=>s.unread);
  $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-k="${k}" class="${k===tab?'on':''}">${v[0]}${k==='live'&&L.online?' 🟢':''}${k==='live'&&anyUnread?'<span class="rdot"></span>':''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;openSid=null;draw()});
  $('#main').innerHTML=TABS[tab][1]();
  bind();
  clearInterval(liveTimer);
  if(tab==='live')liveTimer=setInterval(liveTick,4000);
}

function vOverview(){
  const v=D.stats.visits||{},days=Object.keys(v).sort(),today=new Date().toISOString().slice(0,10);
  const week=days.slice(-7).reduce((a,k)=>a+v[k],0);
  return `<div class="grid">
   <div class="card"><div class="num">${v[today]||0}</div><span>زيارات اليوم</span></div>
   <div class="card"><div class="num">${week}</div><span>زيارات آخر 7 أيام</span></div>
   <div class="card"><div class="num">${D.stats.chats||0}</div><span>رسائل الدردشة</span></div>
   <div class="card"><div class="num">${D.inbox.length}</div><span>رسائل واردة</span></div></div>
   <div class="card"><h3>الحالة</h3><p>الدردشة: <b>${D.cfg.chatOn?'✅ شغالة':'⏸️ متوقفة'}</b></p><p>الرد المباشر: <b>${L.online?'🟢 أنت متصل، الذكاء متوقف عن الرد':'⚪ الذكاء يرد بدالك'}</b></p></div>`;
}
function vSite(){const c=D.cfg;return `<div class="card"><h3>شريط إعلان</h3>
  <label class="sw"><input type="checkbox" id="bo" ${c.bannerOn?'checked':''}> إظهار الشريط أعلى الموقع</label>
  <input type="text" id="bt" value="${esc(c.banner)}" placeholder="مثال: متاح لمشاريع جديدة 🚀"></div>
  <div class="card"><h3>الدردشة</h3><label class="sw"><input type="checkbox" id="co" ${c.chatOn?'checked':''}> تشغيل الدردشة للزوار</label></div>
  <button class="btn" id="save">حفظ</button>`}
function vAI(){return `<div class="card"><h3>شخصية الذكاء</h3>
  <textarea id="pe" placeholder="مثال: خلّك مرح أكثر، اذكر إنك تحب كرة القدم، لا تستخدم إيموجي...">${esc(D.cfg.persona)}</textarea>
  <p class="hint">هذا النص يُضاف فوق التعليمات الأساسية (المعلومات عنك محفوظة في الـ Worker). يسري فوراً بعد الحفظ.</p></div><button class="btn" id="save">حفظ</button>`}
function vProjects(){return `<div class="card"><h3>المشاريع (تظهر في الموقع)</h3>
  ${P.map((p,i)=>`<div class="row"><input type="text" data-i="${i}" data-f="name" value="${esc(p.name)}" placeholder="الاسم"><input type="text" data-i="${i}" data-f="desc" value="${esc(p.desc)}" placeholder="الوصف"><input type="text" data-i="${i}" data-f="stack" value="${esc(p.stack)}" placeholder="Python, API"><button class="btn r" data-del="${i}">حذف</button></div>`).join('')}
  <button class="btn g" id="add">+ إضافة مشروع</button></div><button class="btn" id="save">حفظ</button>`}
function vInbox(){return `<div class="card"><h3>الرسائل الواردة (${D.inbox.length})</h3>${D.inbox.map(m=>`<div class="item"><small>${esc(m.name||'بدون اسم')} · ${fmt(m.t)}</small><p>${esc(m.msg)}</p></div>`).join('')||'<p class="hint">ما في رسائل.</p>'}</div>${D.inbox.length?'<button class="btn r" data-clear="inbox">مسح الكل</button>':''}`}

// ===== الدردشة المباشرة =====
function sessListHtml(){
  const q=liveSearch.trim().toLowerCase();
  let list=L.sessions.filter(s=>!q||s.name.toLowerCase().includes(q));
  list=[...list].sort((a,b)=>(b.pinned-a.pinned)||(b.lastAt-a.lastAt));
  return list.map(s=>`<div class="sess ${s.unread?'unread':''}" data-open="${s.id}"><span><b>${s.pinned?'📌 ':''}${esc(s.name)}${s.unread?'<span class=\"rdot\"></span>':''}</b><small>${fmt(s.lastAt)}</small></span><span class="badge ${s.ended?'end':''}">${s.ended?'منتهية':'نشطة'}</span></div>`).join('')||'<p class="hint">ما في محادثات بعد.</p>';
}
function vLive(){
  if(openSid)return vLiveDetail();
  return `<div class="card"><h3><span class="dot ${L.online?'on':'off'}"></span>${L.online?'أنت متصل الآن':'أنت غير متصل'}</h3>
   <label class="sw"><input type="checkbox" id="pres" ${L.online?'checked':''}> فعّل هذا الخيار وقت تحب ترد على الناس بنفسك بدل الذكاء</label>
   <p class="hint">لما يكون مفعّل، الذكاء يوقف عن الرد وتوصلك الرسائل هنا لترد عليها مباشرة. لما توقفه، الذكاء يرجع يرد تلقائياً.</p></div>
   <div class="card"><h3>هويتك بالدردشة</h3>
   <input type="text" id="on" value="${esc(D.cfg.ownerName)}" placeholder="حسين جبار" style="margin-bottom:10px">
   <input type="text" id="oa" value="${esc(D.cfg.ownerAvatar)}" placeholder="رابط صورتك الشخصية (اختياري)">
   <label class="sw"><input type="checkbox" id="ob" ${D.cfg.ownerBadge?'checked':''}> إظهار علامة توثيق ✓ جنب اسمك</label>
   <p class="hint">مدة انتهاء المحادثة تلقائياً إذا ما صار فيها أي رسالة جديدة (بالدقائق):</p>
   <input type="text" id="ltm" value="${D.cfg.liveTimeoutMin}" inputmode="numeric">
   <p class="hint">ردود جاهزة سريعة (وحدة بكل سطر، تطلع كأزرار جوه أي محادثة):</p>
   <textarea id="cn" placeholder="هلا فيك، شلونك؟&#10;شكراً لتواصلك معي">${esc((D.cfg.canned||[]).join('\n'))}</textarea>
   </div>
   <button class="btn" id="save">حفظ</button>
   <div class="card"><h3>المحادثات (${L.sessions.length})</h3>
   <input type="text" id="liveSearch" placeholder="دوّر باسم..." value="${esc(liveSearch)}" style="margin-bottom:12px">
   <div id="sessList">${sessListHtml()}</div>
   </div>`;
}
function vLiveDetail(){
  if(!S)return '<p class="hint">...جارِ التحميل</p>';
  const canned=D.cfg.canned||[];
  return `<button class="btn g" id="back">← رجوع للقائمة</button>
   <div class="card" style="margin-top:14px">
   <h3 style="display:flex;justify-content:space-between;align-items:center">${esc(S.name)}<button class="pinbtn" id="pinBtn" title="تثبيت المحادثة">${S.pinned?'📌':'📍'}</button></h3>
   <div id="liveMsgs">${liveMsgsHtml(S.msgs)}</div>
   ${canned.length?`<div class="canned">${canned.map((c,i)=>`<button data-cn="${i}">${esc(c)}</button>`).join('')}</div>`:''}
   <div class="replyRow"><textarea id="replyBox" placeholder="اكتب ردّك هنا..."></textarea><button class="btn" id="replySend">إرسال</button></div>
   </div>
   <div class="card"><h3>إعدادات هذي المحادثة</h3>
   <label class="sw"><input type="checkbox" id="keep" ${S.keep?'checked':''}> خلّها دائماً، لا تنتهي تلقائياً</label>
   <p class="hint">وقت مخصص لانتهائها بالدقائق (اتركه صفر عشان يستخدم الإعداد العام):</p>
   <input type="text" id="tmin" value="${S.timeoutMin||0}" inputmode="numeric">
   <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
     <button class="btn g" id="liveSave">حفظ الإعدادات</button>
     <button class="btn g" id="endNow">إنهاء المحادثة الآن</button>
     <button class="btn r" id="delConv">حذف المحادثة نهائياً</button>
   </div></div>`;
}
function liveMsgsHtml(msgs){
  return msgs.map(m=>{
    if(m.who==='v')return `<div class="lm v">${esc(m.text)}<small>${fmt(m.t)}</small></div>`;
    const tag=m.who==='o'?'أنت':'زلفي 🤖';
    return `<div class="lm o">${tag}<br>${esc(m.text)}<small>${fmt(m.t)}</small></div>`;
  }).join('')||'<p class="hint">ما في رسائل بعد.</p>';
}
async function openConv(id){openSid=id;S=null;draw();try{S=await api('/api/admin/live/session',{sid:id});api('/api/admin/live/read',{sid:id}).catch(()=>{});draw()}catch(e){toast('فشل التحميل')}}
async function liveTick(){
  try{
    if(openSid){const fresh=await api('/api/admin/live/session',{sid:openSid});S=fresh;const c=$('#liveMsgs');if(c)c.innerHTML=liveMsgsHtml(S.msgs)}
    else{
      L=await api('/api/admin/live');
      const typing=document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
      if(tab==='live'&&!openSid&&!typing)draw();
    }
  }catch(e){}
}

function bind(){
  const m=$('#main');
  m.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>P[i.dataset.i][i.dataset.f]=i.value);
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{P.splice(+b.dataset.del,1);draw()});
  const a=$('#add');if(a)a.onclick=()=>{if(P.length<12){P.push({name:'',desc:'',stack:''});draw()}};
  m.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{if(confirm('متأكد؟')){await api('/api/admin/clear',{what:b.dataset.clear});D[b.dataset.clear]=[];draw();toast('تم')}});
  const s=$('#save');if(s)s.onclick=save;
  const pr=$('#pres');if(pr)pr.onchange=async()=>{try{await api('/api/admin/live/presence',{online:pr.checked});L.online=pr.checked;draw();toast(pr.checked?'صرت متصل':'رجع الذكاء يرد')}catch(e){toast('صار خطأ')}};
  bindSessList();
  const back=$('#back');if(back)back.onclick=()=>{openSid=null;S=null;draw()};
  const rs=$('#replySend');if(rs)rs.onclick=sendReply;
  const rb=$('#replyBox');if(rb)rb.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply()}});
  const ls=$('#liveSave');if(ls)ls.onclick=saveConvSettings;
  const en=$('#endNow');if(en)en.onclick=async()=>{await api('/api/admin/live/settings',{sid:openSid,end:true});toast('تم الإنهاء');openConv(openSid)};
  const dc=$('#delConv');if(dc)dc.onclick=async()=>{if(confirm('حذف هذي المحادثة نهائياً؟')){await api('/api/admin/live/delete',{sid:openSid});openSid=null;S=null;L=await api('/api/admin/live');draw();toast('تم الحذف')}};
  const pb=$('#pinBtn');if(pb)pb.onclick=async()=>{S.pinned=!S.pinned;await api('/api/admin/live/settings',{sid:openSid,pinned:S.pinned});draw();toast(S.pinned?'تم التثبيت':'تم إلغاء التثبيت')};
  m.querySelectorAll('[data-cn]').forEach(b=>b.onclick=()=>{const rb=$('#replyBox');if(rb){rb.value=(D.cfg.canned||[])[+b.dataset.cn]||'';rb.focus()}});
  const se=$('#liveSearch');if(se)se.oninput=()=>{liveSearch=se.value;const sl=$('#sessList');if(sl){sl.innerHTML=sessListHtml();bindSessList()}};
}
function bindSessList(){const sl=$('#sessList');if(sl)sl.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openConv(el.dataset.open))}
async function sendReply(){
  const t=$('#replyBox'),text=t.value.trim();if(!text)return;t.value='';
  try{await api('/api/admin/live/reply',{sid:openSid,text});S=await api('/api/admin/live/session',{sid:openSid});$('#liveMsgs').innerHTML=liveMsgsHtml(S.msgs)}
  catch(e){toast('فشل الإرسال')}
}
async function saveConvSettings(){
  const keep=$('#keep').checked,tmin=+($('#tmin').value)||0;
  try{await api('/api/admin/live/settings',{sid:openSid,keep,timeoutMin:tmin});toast('تم الحفظ ✓')}catch(e){toast('فشل الحفظ')}
}
async function save(){
  const g=id=>$('#'+id),c=D.cfg;
  if(g('bo')){c.bannerOn=g('bo').checked;c.banner=g('bt').value;c.chatOn=g('co').checked}
  if(g('pe'))c.persona=g('pe').value;
  if(g('on')){c.ownerName=g('on').value;c.ownerAvatar=g('oa').value.trim();c.ownerBadge=g('ob').checked;c.liveTimeoutMin=+g('ltm').value||60;c.canned=g('cn').value.split('\n').map(x=>x.trim()).filter(Boolean)}
  c.projects=tab==='projects'||c.projects?P.filter(p=>p.name.trim()):null;
  try{await api('/api/admin/config',c);toast('تم الحفظ ✓')}catch(e){toast('فشل الحفظ')}
}
if(code)load();
</script>
